<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campaign Contributions Map</title>

  <!-- Leaflet CSS for OpenStreetMap -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Header -->
  <header>
    <div class="header-content">
      <h1>Campaign Contributions Map</h1>
      <div class="controls">
        <label for="candidate-select">Candidate:</label>
        <select id="candidate-select">
          <option value="">Loading...</option>
        </select>

        <div class="filter-toggle">
          <label>
            <input type="radio" name="contributor-filter" value="all" checked>
            All
          </label>
          <label>
            <input type="radio" name="contributor-filter" value="individual">
            Individual
          </label>
          <label>
            <input type="radio" name="contributor-filter" value="business">
            Business
          </label>
        </div>

        <span id="contribution-count" class="count"></span>
      </div>
    </div>
  </header>

  <!-- Map Container -->
  <div id="map"></div>

  <!-- Footer -->
  <footer>
    <div class="footer-content">
      <p>
        <span class="legend">
          <span class="legend-item">
            <span class="marker-symbol individual">●</span> Individual Contributions
          </span>
          <span class="legend-item">
            <span class="marker-symbol business">●</span> Business Contributions
          </span>
        </span>
      </p>
    </div>
  </footer>

  <!-- Leaflet JavaScript for OpenStreetMap -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>

  <!-- Custom JavaScript -->
  <script src="app.js"></script>
</body>
</html>
